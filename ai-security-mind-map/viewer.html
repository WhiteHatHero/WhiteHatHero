<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Security Mind Map — Jordan Warren</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f8f5;color:#252824;font:14px system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column}button,select,a{font:inherit}button,select,.download{border:1px solid #d7d7cd;border-radius:6px;background:white;color:#252824;padding:9px 12px;cursor:pointer}button:hover,a:hover{background:#f0e6da}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #bd7139;outline-offset:2px}header{padding:12px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #ddd;background:#fff}header strong{margin-right:auto;font-size:15px}.download{text-decoration:none}#viewport{flex:1;position:relative;overflow:hidden;min-height:220px;touch-action:none}svg{width:100%;height:100%;display:block;cursor:grab;background-image:radial-gradient(#d9d9d2 .7px,transparent .7px);background-size:18px 18px}svg:active{cursor:grabbing}.card-text{height:100%;width:100%;padding:14px;display:flex;flex-direction:column;justify-content:center;line-height:1.25;overflow:hidden;white-space:normal;overflow-wrap:anywhere;cursor:pointer;font-family:'Segoe Print','Comic Sans MS',system-ui,sans-serif}.card-text p{margin:0 0 .25em}.card-text ul,.card-text ol{margin:0;padding-left:1.35em}.card-text li p{margin:0}.card-text pre{white-space:pre-wrap}.card-text a{color:inherit}.node:focus{outline:none}.node:focus rect{stroke-width:6}.hint{padding:8px 16px;background:#fff;border-top:1px solid #ddd;color:#666;font-size:12px}dialog{border:1px solid #ddd;border-radius:14px;max-width:760px;width:calc(100% - 24px);max-height:85dvh;padding:24px;overflow:auto;box-shadow:0 12px 90px #0004}dialog::backdrop{background:#0006}dialog button{float:right;margin-left:12px}dialog #reading{font:16px/1.65 system-ui;white-space:normal;overflow-wrap:anywhere}#reading p{white-space:pre-wrap}#reading ul,#reading ol{padding-left:24px}#textview{display:none;overflow:auto;flex:1;padding:20px;max-width:980px;width:100%;margin:auto}#textview article{padding:20px;background:white;border:1px solid #ddd;margin-bottom:16px;border-radius:10px;line-height:1.6;white-space:normal;overflow-wrap:anywhere}#textview p{white-space:pre-wrap}body.reading #viewport{display:none}body.reading #textview{display:block}@media(max-width:600px){header{padding:8px;gap:5px}header strong{width:100%}button,select,.download{padding:8px;font-size:12px}.hint{font-size:11px}}
</style></head><body><header><strong>AI Security Mind Map <small> / Jordan Warren</small></strong><select id="section" aria-label="Jump to topic"><option value="all">Whole board</option><option value="stack">AI stack</option><option value="flow">LLM workflow</option><option value="attacks">Attack methods</option><option value="mcp">MCP security</option><option value="controls">Controls & OWASP</option></select><button id="minus" aria-label="Zoom out">−</button><button id="plus" aria-label="Zoom in">+</button><button id="fit">Fit</button><button id="read">Read text</button><a class="download" href="AI_Security_Mind_Map.tldr" download>Download .tldr</a></header><div id="viewport"><svg id="map" role="group" aria-label="Interactive AI security mind map. Drag to pan, zoom with controls, or select a card to read." viewBox="-500 -160 6300 4550"><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><g id="shapes"></g></svg></div><div id="textview"></div><div class="hint" id="status" aria-live="polite">Drag to pan · Scroll or +/− to zoom · Select a card to read · Study synthesis based on Netskope training notes</div><dialog id="detail"><button id="close">Close</button><div id="reading"></div></dialog><script>
'use strict';
const NS='http://www.w3.org/2000/svg', svg=document.querySelector('#map'),root=document.querySelector('#shapes'),dialog=document.querySelector('#detail');
const colors={black:'#252824',grey:'#727670',red:'#bc3d36','light-red':'#d6534e',orange:'#b56728',yellow:'#8c7900',green:'#167355','light-green':'#527e2c',blue:'#315aad','light-blue':'#2686a5',violet:'#76529e','light-violet':'#926ab0',white:'#fff'};
const sizes={s:18,m:24,l:30,xl:38};let bounds=[-500,-160,6300,4550],drag=null,moved=false;
function node(tag,attrs={},parent=root){const n=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);parent.append(n);return n;}
function rich(o){if(!o)return '';if(o.type==='text'){let t=escape(o.text||'');for(const m of o.marks||[])if(m.type==='bold')t='<strong>'+t+'</strong>';else if(m.type==='italic')t='<em>'+t+'</em>';return t;}const inside=(o.content||[]).map(rich).join('');const tag={paragraph:'p',bulletList:'ul',orderedList:'ol',listItem:'li',codeBlock:'pre'}[o.type];return tag?'<'+tag+'>'+inside+'</'+tag+'>':inside;}
function escape(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function text(o){return o?.text||(o?.content||[]).map(text).join(' ');}
function view(b){bounds=b;svg.setAttribute('viewBox',b.join(' '));}
function zoom(f){const[x,y,w,h]=bounds,nw=Math.min(13000,Math.max(350,w*f));view([x+(w-nw)/2,y+(h-h*nw/w)/2,nw,h*nw/w]);}
const sections={all:[-500,-160,6300,4550],stack:[-60,-40,2320,1300],flow:[-440,1200,2800,1950],attacks:[2380,340,1500,2380],mcp:[2290,2810,1880,1050],controls:[4100,360,1550,3900]};
document.querySelector('#section').onchange=e=>view([...sections[e.target.value]]);document.querySelector('#plus').onclick=()=>zoom(.75);document.querySelector('#minus').onclick=()=>zoom(1.33);document.querySelector('#fit').onclick=()=>view([...sections.all]);
document.querySelector('#read').onclick=()=>{const enabled=document.body.classList.toggle('reading');document.querySelector('#read').textContent=enabled?'Show map':'Read text';};document.querySelector('#close').onclick=()=>dialog.close();
svg.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?1.12:.89);},{passive:false});
svg.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,b:[...bounds]};moved=false;svg.setPointerCapture(e.pointerId);});
svg.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)moved=true;const rect=svg.getBoundingClientRect(),ratio=Math.max(drag.b[2]/rect.width,drag.b[3]/rect.height);view([drag.b[0]-dx*ratio,drag.b[1]-dy*ratio,drag.b[2],drag.b[3]]);});
svg.addEventListener('pointerup',e=>{drag=null;if(svg.hasPointerCapture(e.pointerId))svg.releasePointerCapture(e.pointerId);if(!moved){const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.node');if(target?.dataset.html){document.querySelector('#reading').innerHTML=target.dataset.html;dialog.showModal();}}});svg.addEventListener('pointercancel',()=>drag=null);
fetch('AI_Security_Mind_Map.tldr').then(r=>{if(!r.ok)throw Error('Board unavailable');return r.json();}).then(doc=>{
const records=doc.records,byId=Object.fromEntries(records.map(r=>[r.id,r])),bindings=records.filter(r=>r.typeName==='binding');
for(const r of records.filter(r=>r.typeName==='shape'&&r.parentId==='page:page').sort((a,b)=>(a.index<b.index?-1:a.index>b.index?1:0))){
 const p=r.props,c=colors[p.color]||colors.black,x=r.x,y=r.y,w=p.w||400,h=(p.h||180)+(p.growY||0),content=rich(p.richText),hasText=text(p.richText).trim();
 if(r.type==='line'){const pts=Object.values(p.points).sort((a,b)=>a.index.localeCompare(b.index)).map(q=>`${x+q.x},${y+q.y}`).join(' ');node('polyline',{points:pts,fill:'none',stroke:c,'stroke-width':3,'stroke-dasharray':p.dash==='dashed'?'10 7':'none'});continue;}
 if(r.type==='arrow'){
  function pt(end){const b=bindings.find(b=>b.fromId===r.id&&b.props.terminal===end);if(b){const t=byId[b.toId],a=b.props.normalizedAnchor;return [t.x+t.props.w*a.x,t.y+(t.props.h+(t.props.growY||0))*a.y];}return [x+p[end].x,y+p[end].y];}
  const a=pt('start'),b=pt('end'),dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy)||1,bend=p.bend||0;node('path',{d:`M${a} Q${(a[0]+b[0])/2-dy/len*bend*2},${(a[1]+b[1])/2+dx/len*bend*2} ${b}`,fill:'none',stroke:c,'stroke-width':3,'marker-end':p.arrowheadEnd==='none'?'':'url(#tip)'});continue;
 }
 if(!['geo','text'].includes(r.type))continue;
 const g=node('g',{class:'node',transform:`translate(${x} ${y}) rotate(${r.rotation*180/Math.PI})`});
 if(r.type==='geo'){const fill=p.fill==='none'||!hasText?'none':'#fffefb';if(p.geo==='ellipse')node('ellipse',{cx:w/2,cy:h/2,rx:w/2,ry:h/2,fill,stroke:c,'stroke-width':3},g);else if(p.geo==='diamond')node('polygon',{points:`${w/2},0 ${w},${h/2} ${w/2},${h} 0,${h/2}`,fill,stroke:c,'stroke-width':3},g);else node('rect',{width:w,height:h,rx:5,fill,stroke:c,'stroke-width':3},g);}
 if(!hasText)continue;g.setAttribute('tabindex','0');g.setAttribute('role','button');g.setAttribute('aria-label',hasText.slice(0,120));g.dataset.html=content;g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();document.querySelector('#reading').innerHTML=content;dialog.showModal();}});
 const fo=node('foreignObject',{width:w,height:r.type==='text'?Math.max(h,300):h},g);const div=document.createElement('div');div.setAttribute('xmlns','http://www.w3.org/1999/xhtml');div.className='card-text';div.innerHTML=content;div.style.color=colors[p.labelColor||p.color]||colors.black;div.style.fontSize=(sizes[p.size]||24)+'px';div.style.textAlign=(p.align==='middle'||p.textAlign==='middle')?'center':'left';if(r.type==='text')div.style.justifyContent='flex-start';fo.append(div);
 let fs=sizes[p.size]||24;while(div.scrollHeight>div.clientHeight+1&&fs>10){fs-=.5;div.style.fontSize=fs+'px';}
 const article=document.createElement('article');article.innerHTML=content;document.querySelector('#textview').append(article);
}
}).catch(e=>document.querySelector('#status').textContent='Unable to load the map. Please reload or download the .tldr file.');
</script></body></html>
